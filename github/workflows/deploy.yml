name: Deploy to Vercel

# Quando esse workflow é executado:
# - Em todo push para a branch master
on:
  push:
    branches:
      - master

# Variáveis de ambiente disponíveis para todos os jobs
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build e Deploy
    runs-on: ubuntu-latest  # Máquina virtual que vai executar os passos

    steps:
      # Passo 1: Baixa o código do repositório na máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Configura o Node.js na versão 20
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # Faz cache das dependências para deploys mais rápidos

      # Passo 3: Instala as dependências do projeto
      - name: Instalar dependências
        run: npm ci

      # Passo 4: Instala a Vercel CLI na máquina virtual
      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      # Passo 5: Baixa as configurações do projeto da Vercel
      - name: Pull das configurações da Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Passo 6: Builda o projeto usando as configs da Vercel
      - name: Build do projeto
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Passo 7: Envia o build para a Vercel e publica em produção
      - name: Deploy para produção
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}